        <h1>IMS Engine: Inventory Management Software</h1>
        <p>IMS Engine is inventory management software for stock levels, supplier purchases, customer sales, payments and profit reports. Every purchase updates the item’s average cost, and every sale records the cost it was sold at.</p>
        <ul>
          <li>Live stock levels: see what is on the shelf, what needs reordering and what is out of stock.</li>
          <li>Purchases at true cost: each purchase updates the weighted-average cost automatically.</li>
          <li>Sales and invoices: record sales, print invoices and track what customers still owe.</li>
          <li>Payments and reports: log receipts and supplier payments, then review sales, profit and monthly trends.</li>
        </ul>
